name: explainablehrc

services:
  ros2-desktop:
    image: explainablehrc:jazzy
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:6080:80"
    security_opt:
      - seccomp=unconfined
    shm_size: "1gb"
    environment:
      USER: ubuntu
      PASSWORD: ubuntu
      ROS_DISTRO: jazzy
      LIBGL_ALWAYS_SOFTWARE: "1"
    volumes:
      - ../ros2_ws:/home/ubuntu/ros2_ws
    stdin_open: true
    tty: true
    restart: unless-stopped
